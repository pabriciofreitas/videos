        - asset: assets/font/Epilogue/Epilogue-SemiBold.ttf
          weight: 600
        - asset: assets/font/Epilogue/Epilogue-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/font/Epilogue/Epilogue-Bold.ttf
          weight: 700
        - asset: assets/font/Epilogue/Epilogue-BoldItalic.ttf
          weight: 700
